<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Zeitnot: a clock-dial ring split into the two players' colours, a pawn at the centre,
       and a live dot in the gap at 12 o'clock. Artwork is 96x96 inside the store's 16px clear space. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3175"/>
      <stop offset="1" stop-color="#090b1f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5e4ff"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cde0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#sheen)"/>
  <rect x="16.8" y="16.8" width="94.4" height="94.4" rx="23.2" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.6"/>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M57.14 31.72A33 33 0 0 0 57.14 96.28" stroke="url(#amber)"/>
    <path d="M70.86 31.72A33 33 0 0 1 70.86 96.28" stroke="url(#cyan)"/>
  </g>
  <circle cx="64" cy="30.6" r="3.4" fill="#7ff0a4"/>
  <g fill="url(#pawn)">
    <circle cx="64" cy="52" r="6.6"/>
    <rect x="57" y="58.4" width="14" height="3.8" rx="1.9"/>
    <path d="M60.2 62 L67.8 62 C68 68 71 73 73 77 L55 77 C57 73 60 68 60.2 62 Z"/>
    <rect x="51" y="76.6" width="26" height="5.8" rx="2.9"/>
  </g>
</svg>
