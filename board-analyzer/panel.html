<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="boardWrap">
    <div id="board"></div>
    <svg id="arrows" viewBox="0 0 8 8"></svg>
    <div id="promo" hidden></div>
    <div id="evalbar"><div id="evalfill"></div></div>
  </div>

  <div id="best">
    <span id="bestMove">—</span>
    <span id="bestEval"></span>
    <span id="depth"></span>
  </div>
  <div id="lines"></div>

  <div class="row">
    <button id="snap" class="primary" title="Read the board currently shown on the page">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5 5.2 4H3.5A1.5 1.5 0 0 0 2 5.5v6A1.5 1.5 0 0 0 3.5 13h9a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 12.5 4h-1.7L10 2.5H6zM8 11a2.7 2.7 0 1 1 0-5.4A2.7 2.7 0 0 1 8 11zm0-1.4a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/></svg>
      Snapshot
    </button>
    <button id="undo" class="icon" title="Undo (←)" aria-label="Undo">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.2 2.6 7l3.9 3.8V8.4c2.9 0 4.6.8 5.9 3.1-.1-3.4-2.2-5.7-5.9-5.9V3.2z"/></svg>
    </button>
    <button id="redo" class="icon" title="Redo (→)" aria-label="Redo">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3.2 13.4 7l-3.9 3.8V8.4c-2.9 0-4.6.8-5.9 3.1.1-3.4 2.2-5.7 5.9-5.9V3.2z"/></svg>
    </button>
    <button id="flip" class="icon" title="Flip board" aria-label="Flip board">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 2 2 5.2h2.2V12h1.9V5.2h2.2L5.2 2zm5.6 12L14 10.8h-2.2V4h-1.9v6.8H7.7L10.8 14z"/></svg>
    </button>
  </div>

  <div class="row toggles">
    <label class="chip"><input type="checkbox" id="auto"><span>Auto-follow</span></label>
  </div>

  <div class="row fenrow">
    <input id="fen" spellcheck="false" placeholder="Paste FEN here…">
    <button id="go" class="primary">Analyze</button>
  </div>

  <div class="row links">
    <button id="openLichess" class="link" title="Open this position on the Lichess analysis board">
      Lichess <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7H12V5.1L7.6 9.5 6.5 8.4 10.9 4H9V2.5zM3.5 4H7v1.5H4v6.5h6.5V9H12v4.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5z"/></svg>
    </button>
    <button id="openChesscom" class="link" title="Open this position on the Chess.com analysis board">
      Chess.com <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7H12V5.1L7.6 9.5 6.5 8.4 10.9 4H9V2.5zM3.5 4H7v1.5H4v6.5h6.5V9H12v4.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5z"/></svg>
    </button>
    <button id="copyFen" class="link" title="Copy this position as FEN">Copy FEN</button>
  </div>

  <div class="row small">
    <label>Turn
      <select id="turn"><option value="auto">auto</option><option value="w">white</option><option value="b">black</option></select>
    </label>
    <label>Depth <input id="depthMax" type="number" min="8" max="30" value="20"></label>
    <label>Lines <select id="multipv"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
    <label title="Glass uses a blur effect; Basic is a solid panel that is lighter on weak devices. Auto picks for you.">Style
      <select id="glass"><option value="auto">Auto</option><option value="on">Glass</option><option value="off">Basic</option></select>
    </label>
  </div>
  <div id="status"></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
